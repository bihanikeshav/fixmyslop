name = "fixmyslop"
main = "src/index.mjs"
compatibility_date = "2026-08-11"

# JSON is imported directly (import corpus from "../../engine/data/corpus.json")
# and bundled at build time — Workers have no runtime fs. The engine is pure, so
# no nodejs_compat flag is required.

# Static frontend (apps/web) served from the SAME Worker via Cloudflare Static Assets.
# Assets are matched FIRST for GET/HEAD: "/" → apps/web/index.html (the UI at root),
# "/demo/*", "/vendor/*", "/viz/*" → their files. Any path with no matching asset
# (POST /mcp, /api/*, /install, /skill, /health, GET /sse) falls through to the Worker
# below, so the API + MCP + install surfaces are unchanged. not_found_handling stays
# default ("none") so unknown paths hit the Worker's 404, not index.html.
[assets]
directory = "../web"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Per-IP rate limiting for the compute surface (POST /api/tool/*, /mcp, /api/*).
#
# This Worker is public and unauthenticated, and its tools run a 1,971-point KDE and a
# layout retrieval index — cheap per call, but trivially loopable. The Rate Limiting
# binding is enforced at the edge, costs nothing when under the limit, and needs no
# storage of our own.
#
# `namespace_id` is a per-account identifier for THIS limiter, not a secret; bump it if the
# limit/period below changes and you want the counters reset. src/guard.mjs degrades OPEN
# when the binding is missing (node --test has no env at all) or when .limit() throws, so
# local dev and the test suite keep working unchanged.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[vars]
# Hosts allowed to appear inside the `curl | sh` installer at /skill and the copy-paste
# commands at /install.md — see src/guard.mjs (installOrigin). Comma-separated; the
# canonical workers.dev host plus localhost are always allowed. Anything else falls back
# to the canonical origin instead of reflecting the caller's Host header into a shell
# script. Set this when deploying behind a custom domain.
SKILL_ORIGIN_ALLOWLIST = ""
